name: Update stat leaders

on:
  schedule:
    # 11:15 UTC every day (early morning US time, after the night's games)
    - cron: "15 11 * * *"
    # plus 05:30 UTC (about 12:30 AM Central) to catch late games during the playoffs
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas lxml requests

      - name: Pull stats
        run: python scripts/fetch_stats.py

      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add -f docs/data/stats.json
          git diff --cached --quiet || git commit -m "Update stats $(date -u +'%Y-%m-%d')"
          git push
